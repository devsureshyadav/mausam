<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mausam – Premium Weather App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <img src="weather_hero_1780329865865.png" alt="Weather hero" class="hero-image" />
    <div class="hero-content">
      <h1 class="city-name">Your City</h1>
      <p class="temperature">22°C</p>
      <p class="description">Sunny</p>
    </div>

  <main class="content">
    <section class="forecast">
      <h2>7‑Day Forecast</h2>
      <div class="forecast-grid" id="forecast-grid">
        <!-- JavaScript will inject cards here -->
      </div>
    </section>
  </main>

  <footer class="footer">
    <nav class="footer-nav">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms &amp; Conditions</a>
    </nav>
    <p>© 2026 Mausam. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>

</html>
